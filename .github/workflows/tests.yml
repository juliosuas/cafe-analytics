name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pipeline:
    name: Pipeline (${{ matrix.os }}, Python 3.12)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System video dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1 libglib2.0-0
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Download and verify official demo assets
        run: python scripts/download_assets.py
      - name: Tests, including real ONNX inference
        run: python -m pytest -q -W error
      - name: Complete public demo pipeline
        run: python -W error -m cafe_analytics.cli run --source assets/retail.mp4 --config configs/demo.json --output runs/ci
      - name: Verify video, metrics and published documentation
        run: |
          python scripts/verify_run.py runs/ci
          python scripts/check_docs.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: demo-results-${{ matrix.os }}
          path: runs/ci/
          if-no-files-found: warn
          retention-days: 7
