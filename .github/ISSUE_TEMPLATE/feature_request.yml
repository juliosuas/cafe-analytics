name: Proponer una mejora
description: Una mejora vinculada a una decisión del dueño del negocio.
title: "[Mejora] "
body:
  - type: textarea
    id: decision
    attributes:
      label: Qué decisión ayudaría a tomar
      description: Describe el problema operacional, no solo la funcionalidad.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia y forma de validación
      description: Cómo sabremos si los datos son suficientes y si la mejora funciona.
    validations:
      required: true
