[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cafe-analytics"
version = "0.1.0"
description = "Local person tracking and zone analytics for evidence-based retail operations"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.14"
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "opencv-python==4.11.0.86", "onnxruntime==1.22.1"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
cafe-analytics = "cafe_analytics.cli:main"

[tool.setuptools.packages.find]
include = ["cafe_analytics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://juliosuas.github.io/cafe-analytics/"
Repository = "https://github.com/juliosuas/cafe-analytics"
Documentation = "https://github.com/juliosuas/cafe-analytics/tree/main/docs"
Issues = "https://github.com/juliosuas/cafe-analytics/issues"
